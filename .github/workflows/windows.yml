name: Windows uygulamasi

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Derle
        run: dotnet publish desktop/KardeslerVPN.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out
      - name: Indirme sayfasina yukle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp out/KardeslerVPN.exe ./KardeslerVPN.exe
          gh release view son -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create son -R "$GITHUB_REPOSITORY" --title "Kardeşler VPN (son sürüm)" \
              --notes "Telefon: KardeslerVPN.apk · Bilgisayar: KardeslerVPN.exe" --latest || true
          gh release upload son "KardeslerVPN.exe" -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: KardeslerVPN-windows
          path: out/KardeslerVPN.exe
